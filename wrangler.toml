name = "webstream"
main = "worker/worker.js"
compatibility_date = "2025-01-15"

# Static assets di folder public/ akan otomatis di-serve untuk path apapun
# yang tidak match dengan rute di worker.js
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# === Secrets (HARUS pakai tipe Secret, BUKAN Variable!) ===
# Cara set:
#   - Via dashboard: Settings → Variables and Secrets → + Add → Type: SECRET (encrypted)
#   - Via CLI: wrangler secret put NAMA
#
# CATATAN PENTING: Cloudflare AKAN MENGHAPUS plaintext variable yang tidak ada
# di [vars] section ini setiap kali deploy. Tapi SECRET (encrypted) PERSISTEN.
# Selalu pakai tipe Secret untuk: SUBSOURCE_API_KEY, TMDB_API_KEY,
# SUPABASE_SERVICE_KEY, PLAYER4ME_API_TOKEN.

[vars]
SUPABASE_URL = "https://gmjudsbreuyyznxtfjve.supabase.co"
# Anon key Supabase memang dirancang untuk publik (RLS yang melindungi).
SUPABASE_ANON_KEY = "sb_publishable_sEx8JuiK0J0qlf8Dy5P3Pg_9iCVpRGn"
# URL gdi-worker yang aktif (untuk display & build URL stream ke client).
# CATATAN: untuk fetch internal Worker→Worker, kita pakai service binding GDI
# (lihat [[services]] di bawah) untuk bypass error CF 1042 (cross-zone block).
GDI_WORKER_URL = "https://gdriveindex.zaeinstreamx.workers.dev"
# Email admin (boleh banyak, dipisah koma) — yang boleh akses panel admin.
ADMIN_EMAILS = "sholehhuddin21@gmail.com"
# Domain custom Player4Me (white-label / ad-free). Worker pakai ini untuk
# membentuk URL embed VIP: https://<domain>/#<id>
# Basic tier tetap pakai https://player4me.com/embed/<id> (yang ada iklan).
# Kosongkan kalau belum punya custom domain — fallback ke player4me.com/embed
# untuk kedua tier.
PLAYER4ME_PUBLIC_DOMAIN = ""

# === Player4Me ===
# Service migration: video hosting & player pindah dari Drive Index → Player4Me.
# PLAYER4ME_API_TOKEN harus di-set sebagai Secret di Cloudflare:
#   wrangler secret put PLAYER4ME_API_TOKEN
#
# (External cross-project Supabase env vars sudah dihapus — semua auth
# sekarang pakai SUPABASE_URL / SUPABASE_SERVICE_KEY langsung.)

# === Service Binding ke gdi-worker ===
# Cloudflare Workers TIDAK BISA fetch Worker lain di *.workers.dev via URL publik
# (return error 1042). Solusi: pakai service binding — internal RPC, no network hop.
# Worker `gdriveindex` HARUS sudah di-deploy duluan supaya binding bisa di-resolve.
[[services]]
binding = "GDI"
service = "gdriveindex"
