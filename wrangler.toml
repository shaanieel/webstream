name = "webstream"
main = "worker/worker.js"
compatibility_date = "2025-01-15"

# Static assets di folder public/ akan otomatis di-serve untuk path apapun
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# === Secrets (HARUS pakai tipe Secret, BUKAN Variable!) ===
# Cara set:
#   - Via dashboard: Settings → Variables and Secrets → + Add → Type: SECRET (encrypted)
#   - Via CLI: wrangler secret put NAMA

[vars]
SUPABASE_URL = "https://gmjudsbreuyyznxtfjve.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_sEx8JuiK0J0qlf8Dy5P3Pg_9iCVpRGn"
# Email admin — yang boleh akses panel admin
ADMIN_EMAILS = "sholehhuddin21@gmail.com"

# R2 streaming: frontend butuh tau domain publik R2
# Contoh: https://pub-xxxxxxxxxxxxxxx.r2.dev (R2.dev subdomain)
# Set sebagai Secret: wrangler secret put R2_PUBLIC_DOMAIN
R2_PUBLIC_DOMAIN = "https://pub-0c8b20c7691f40b8b024516868a0a2f7.r2.dev"

# Nama bucket R2 — dipake worker buat strip dari path
R2_BUCKET_NAME = "zaeinstream-video"

# R2 Media domain (audio + subtitle) — bucket terpisah dari video
R2_MEDIA_PUBLIC_DOMAIN = "https://pub-0c3e24ee0059b5d7deaeee4bd9ace23f.r2.dev"

